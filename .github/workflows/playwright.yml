name: Playwright Mini Project CI/CD

on:
  push:
    branches: [ main, master ]
    # 🔴 1. CHỈ TRIGGER KHI CÓ CHANGE TRONG FOLDER MINI PROJECT
    paths:
      - 'tests/2_mini_project**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tests/2_mini_project/**'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 🔴 2. CHỈ TRỎ LỆNH CHẠY VÀO ĐÚNG THƯ MỤC MINI PROJECT
    - name: Run Only Mini Project Tests
      run: npx playwright test tests/git add2_mini_project

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: mini-project-html-report
        path: playwright-report/
        retention-days: 30