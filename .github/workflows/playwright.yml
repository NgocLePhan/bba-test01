name: Playwright Mini Project CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tests/2_mini_project/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tests/2_mini_project/**'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout repository code
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22 # 🟢 Dùng Node 22 để tránh warning phiên bản cũ

    - name: 3. Install dependencies
      run: npm ci

    - name: 4. Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: 5. Run Only Mini Project Tests
      # 🟢 TRUYỀN ENV TRỰC TIẾP CHO CI/CD TẠI ĐÂY
      env:
        API_BASE_URL: https://reqres.in
        API_KEY: reqres-free-key
      run: npx playwright test tests/2_mini_project

    - name: 6. Upload HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: mini-project-html-report
        path: playwright-report/
        retention-days: 30